[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "order-pipeline"
version = "0.1.0"
description = "Kafka ordering playground — spec 001 order-event pipeline"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # spec 007 — the embedded local state store. Only the consumer uses it; the
    # producer's OrderStore stays in memory by design (003 D12). RocksDB is what Kafka
    # Streams keeps its state in, so 009's ksqlDB state directories will be recognisable
    # rather than opaque (X5).
    "rocksdict>=0.3.29",
]

[tool.setuptools.packages.find]
where = ["src"]
