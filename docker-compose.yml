# The three notification instances differ only in their identity, so the rest is
# written once (002 D2). `--scale` was rejected: it forbids container_name, so
# there is no stable name to `docker restart`, and every replica would share one
# environment block — which makes a distinct group.instance.id per instance
# impossible and defeats static membership outright.
x-notification-consumer: &notification-consumer
  build: .
  command: python -m order_service.consumer.main
  depends_on:
    kafka:
      condition: service_healthy

x-notification-env: &notification-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:19092
  ORDER_LIFECYCLE_TOPIC: order-lifecycle
  SERVICE_NAME: notification
  # One group id across all three — this is the whole feature.
  CONSUMER_GROUP_ID: notification-service
  # Passed through from the host so one variable reconfigures the WHOLE group.
  # An assignor only means anything if every member agrees on it, which is why
  # these are here and not per-instance. Empty reads as unset (002 D10), so a
  # plain `up` is classic + the client default assignor, exactly as 001 behaved.
  #   CONSUMER_ASSIGNMENT_STRATEGY=cooperative-sticky docker compose ... up -d
  #   CONSUMER_GROUP_PROTOCOL=consumer CONSUMER_REMOTE_ASSIGNOR=uniform docker compose ... up -d
  CONSUMER_GROUP_PROTOCOL: ${CONSUMER_GROUP_PROTOCOL:-classic}
  CONSUMER_ASSIGNMENT_STRATEGY: ${CONSUMER_ASSIGNMENT_STRATEGY:-}
  CONSUMER_REMOTE_ASSIGNOR: ${CONSUMER_REMOTE_ASSIGNOR:-}

services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"   # host clients (python, etc.)
    environment:
      # --- KRaft: this node is both controller and broker (no ZooKeeper) ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # --- Listeners ---
      # INTERNAL  -> other containers reach the broker at kafka:19092
      # EXTERNAL  -> your host reaches the broker at localhost:9092
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # --- Single-broker musts: internal topics can't replicate beyond 1 ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_COORDINATOR_REBALANCE_PROTOCOLS: classic,consumer

      # --- Learning-friendly tweaks ---
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # force explicit topic creation
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0  # groups form instantly
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: kafka-playground-cluster-01

    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: playground
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy

  # --- spec 001: prepaid order service + consumer fan-out -----------------
  # One image, four commands. They reach the broker on the INTERNAL listener
  # (kafka:19092), never localhost:9092 — that address only resolves from the
  # host.
  #
  # The three consumers subscribe to the SAME topic with THREE DIFFERENT group
  # ids — that is the fan-out: each one receives every event and keeps its own
  # offset. Spec 002 does the opposite below: notification runs as THREE members
  # of ONE group, so the same three partitions divide between them instead.
  # Both shapes run at once, which is what makes them comparable.
  #
  # All three come up with a plain `docker compose up` — the fan-out is only
  # visible when every group is reading, and T34/T39 need the other two running
  # to show that stopping one leaves them untouched.

  order-service:
    build: .
    container_name: order-service
    command: python -m order_service.producer.app
    ports:
      - "8010:8010"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      ORDER_LIFECYCLE_TOPIC: order-lifecycle
      ORDER_SERVICE_HOST: 0.0.0.0
      ORDER_SERVICE_PORT: 8010
    depends_on:
      kafka:
        condition: service_healthy

  inventory-consumer:
    build: .
    container_name: inventory-consumer
    command: python -m order_service.consumer.main
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      ORDER_LIFECYCLE_TOPIC: order-lifecycle
      SERVICE_NAME: inventory
      CONSUMER_GROUP_ID: inventory-service
    depends_on:
      kafka:
        condition: service_healthy

  # --- spec 002: notification scales out ----------------------------------
  # Three instances, ONE group id. The three partitions divide between them, so
  # each event is handled by exactly one — the inverse of the fan-out above,
  # running on the same topic at the same time. Inventory and analytics stay at
  # one instance each and are the control: they keep seeing every event.
  #
  # Only -1 starts by default. Bring the others in while watching the logs:
  #   docker compose --profile scale-out up -d
  #
  # STATIC_MEMBERSHIP=1 gives each instance a stable group.instance.id, so a
  # restart returns it to its own partitions instead of rebalancing the group.
  # Unset, `${VAR:+x}` yields "" and the consumer reads that as dynamic.

  notification-consumer-1:
    <<: *notification-consumer
    container_name: notification-consumer-1
    environment:
      <<: *notification-env
      CONSUMER_INSTANCE_ID: notification-1
      CONSUMER_INSTANCE_ID_STATIC: ${STATIC_MEMBERSHIP:+notification-1}

  notification-consumer-2:
    <<: *notification-consumer
    container_name: notification-consumer-2
    profiles: ["scale-out"]
    environment:
      <<: *notification-env
      CONSUMER_INSTANCE_ID: notification-2
      CONSUMER_INSTANCE_ID_STATIC: ${STATIC_MEMBERSHIP:+notification-2}

  notification-consumer-3:
    <<: *notification-consumer
    container_name: notification-consumer-3
    profiles: ["scale-out"]
    environment:
      <<: *notification-env
      CONSUMER_INSTANCE_ID: notification-3
      CONSUMER_INSTANCE_ID_STATIC: ${STATIC_MEMBERSHIP:+notification-3}

  analytics-consumer:
    build: .
    container_name: analytics-consumer
    command: python -m order_service.consumer.main
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      ORDER_LIFECYCLE_TOPIC: order-lifecycle
      SERVICE_NAME: analytics
      CONSUMER_GROUP_ID: analytics-service
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  kafka-data:
