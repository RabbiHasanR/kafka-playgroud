services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"   # host clients (python, etc.)
    environment:
      # --- KRaft: this node is both controller and broker (no ZooKeeper) ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # --- Listeners ---
      # INTERNAL  -> other containers reach the broker at kafka:19092
      # EXTERNAL  -> your host reaches the broker at localhost:9092
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # --- Single-broker musts: internal topics can't replicate beyond 1 ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_COORDINATOR_REBALANCE_PROTOCOLS: classic,consumer

      # --- Learning-friendly tweaks ---
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # force explicit topic creation
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0  # groups form instantly
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: kafka-playground-cluster-01

    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: playground
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy

  # --- spec 001: order-event pipeline -------------------------------------
  # Both services share one image and differ only in their command. They reach
  # the broker on the INTERNAL listener (kafka:19092), never localhost:9092 —
  # that address only resolves from the host.

  producer:
    build: .
    container_name: order-producer
    command: python -m order_pipeline.producer.app
    ports:
      - "8000:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      ORDER_EVENTS_TOPIC: order-events
      PRODUCER_HOST: 0.0.0.0
      PRODUCER_PORT: 8000
    depends_on:
      kafka:
        condition: service_healthy

  consumer:
    build: .
    container_name: order-consumer
    command: python -m order_pipeline.consumer.main
    ports:
      - "8001:8001"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      ORDER_EVENTS_TOPIC: order-events
      CONSUMER_GROUP_ID: order-processor
      CONSUMER_STATE_HOST: 0.0.0.0
      CONSUMER_STATE_PORT: 8001
    depends_on:
      kafka:
        condition: service_healthy

  # --- spec 002: prepaid order service + consumer fan-out -----------------
  # One image, four commands. The three consumers subscribe to the SAME topic
  # with THREE DIFFERENT group ids — that is the fan-out: each one receives
  # every event and keeps its own offset. Spec 003 does the opposite, adding a
  # second consumer to one group so the messages divide instead.

  order-service:
    build: .
    container_name: order-service
    command: python -m order_service.producer.app
    ports:
      - "8010:8010"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      ORDER_LIFECYCLE_TOPIC: order-lifecycle
      ORDER_SERVICE_HOST: 0.0.0.0
      ORDER_SERVICE_PORT: 8010
    depends_on:
      kafka:
        condition: service_healthy

  inventory-consumer:
    build: .
    container_name: inventory-consumer
    command: python -m order_service.consumer.main
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      ORDER_LIFECYCLE_TOPIC: order-lifecycle
      SERVICE_NAME: inventory
      CONSUMER_GROUP_ID: inventory-service
    depends_on:
      kafka:
        condition: service_healthy

  notification-consumer:
    build: .
    container_name: notification-consumer
    command: python -m order_service.consumer.main
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      ORDER_LIFECYCLE_TOPIC: order-lifecycle
      SERVICE_NAME: notification
      CONSUMER_GROUP_ID: notification-service
    depends_on:
      kafka:
        condition: service_healthy

  analytics-consumer:
    build: .
    container_name: analytics-consumer
    command: python -m order_service.consumer.main
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      ORDER_LIFECYCLE_TOPIC: order-lifecycle
      SERVICE_NAME: analytics
      CONSUMER_GROUP_ID: analytics-service
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  kafka-data:
