# The three notification instances differ only in their identity, so the rest is
# written once (002 D2). `--scale` was rejected: it forbids container_name, so
# there is no stable name to `docker restart`, and every replica would share one
# environment block — which makes a distinct group.instance.id per instance
# impossible and defeats static membership outright.
# Every service below builds the SAME image and pins the same tag. Without the shared
# tag, compose derives an image name per service — and `docker compose build` skips
# services behind a profile, so notification-consumer-2 and -3 silently keep running
# whatever code they were last built with. That produced a false result once already:
# two members of one group running different specs, with only a missing banner line to
# show for it. One tag makes a stale member impossible, and makes the Dockerfile's
# opening claim ("one image for the order service and all three consumers") true.
# --- spec 004: three brokers, one KRaft cluster ---------------------------------
# The three nodes differ only in node id, hostname, advertised EXTERNAL address, host
# port and volume. Everything else is written once here (004 D1), the way
# x-consumer-image below already does for the five application containers.
#
# `deploy.replicas` was rejected for the same reason 002 rejected `--scale`: it forbids
# container_name, and the whole point of this feature is `docker stop kafka-2`.
#
# The first node keeps container_name `kafka` (004 D2). Renaming it to kafka-1 for
# symmetry would break every `docker exec kafka …` in README.md and create_topics.sh.
x-kafka-broker: &kafka-broker
  image: apache/kafka:4.3.1
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
    interval: 10s
    timeout: 10s
    retries: 10
    start_period: 20s

x-kafka-env: &kafka-env
  # --- KRaft: every node is both controller and broker (000 R0.4, as amended by 004) ---
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  # All three nodes are voters. This is written into the metadata log when a node
  # formats its volume, which is why growing an existing single-node cluster is not
  # possible and the upgrade costs one `docker compose down -v` (004 D9).
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093,2@kafka-2:9093,3@kafka-3:9093

  # --- Listeners ---
  # Shared, because each container binds these inside its OWN network namespace:
  # INTERNAL  -> other containers reach this node at <hostname>:19092
  # EXTERNAL  -> the host reaches it at localhost:<published port>
  # CONTROLLER-> quorum traffic only, never published
  # Only KAFKA_ADVERTISED_LISTENERS differs per node, and it is set on each service.
  KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

  # --- Internal topics are replicated across all three nodes (004 R4.2) ---
  # These were pinned to 1 by the single-broker environment 000 built; R0.17 there is
  # amended to "the broker count". min ISR 2 on the transaction state log is the
  # standard pairing with RF 3 — it tolerates one node down and refuses at two.
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_GROUP_COORDINATOR_REBALANCE_PROTOCOLS: classic,consumer

  # --- Learning-friendly tweaks ---
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # force explicit topic creation
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0  # groups form instantly
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  CLUSTER_ID: kafka-playground-cluster-01

# Every client is told about all three brokers (004 D3, R4.11). One address is enough to
# discover the cluster from metadata — but if that one address is the node that is down,
# the client cannot START, and the failure reads as broken failover rather than as a
# bootstrap list of one. That is the whole reason this is an anchor and not a literal.
x-kafka-bootstrap: &kafka-bootstrap "kafka:19092,kafka-2:19092,kafka-3:19092"

x-consumer-image: &consumer-image
  build: .
  image: kafka-playground:local

x-notification-consumer: &notification-consumer
  <<: *consumer-image
  command: python -m order_service.consumer.main
  depends_on: &consumer-deps
    kafka:
      condition: service_healthy
    kafka-2:
      condition: service_healthy
    kafka-3:
      condition: service_healthy
    postgres:
      condition: service_healthy

x-notification-env: &notification-env
  KAFKA_BOOTSTRAP_SERVERS: *kafka-bootstrap
  ORDER_LIFECYCLE_TOPIC: order-lifecycle
  SERVICE_NAME: notification
  # One group id across all three — this is the whole feature.
  CONSUMER_GROUP_ID: notification-service
  # Passed through from the host so one variable reconfigures the WHOLE group.
  # An assignor only means anything if every member agrees on it, which is why
  # these are here and not per-instance. Empty reads as unset (002 D10), so a
  # plain `up` is classic + the client default assignor, exactly as 001 behaved.
  #   CONSUMER_ASSIGNMENT_STRATEGY=cooperative-sticky docker compose ... up -d
  #   CONSUMER_GROUP_PROTOCOL=consumer CONSUMER_REMOTE_ASSIGNOR=uniform docker compose ... up -d
  CONSUMER_GROUP_PROTOCOL: ${CONSUMER_GROUP_PROTOCOL:-classic}
  CONSUMER_ASSIGNMENT_STRATEGY: ${CONSUMER_ASSIGNMENT_STRATEGY:-}
  CONSUMER_REMOTE_ASSIGNOR: ${CONSUMER_REMOTE_ASSIGNOR:-}

# --- spec 005: where a failed message goes --------------------------------------
# Both topics are created by scripts/create_topics.sh. The retry topic is consumed by
# the retry-worker and by nothing else; the dead-letter topic is consumed by NOTHING,
# which is the whole of what makes it terminal (005 D10). If you ever find yourself
# adding a service that subscribes to DLQ_TOPIC, that is the feature being undone.
#
# The failure lever is passed through from the host with an inert default, the way 002
# does it for CONSUMER_ASSIGNMENT_STRATEGY. It is still per-experiment rather than baked
# in: `up -d --force-recreate inventory-consumer retry-worker` recreates only those two,
# so every other consumer keeps running without it.
#
# Both names are needed together for a `transient` run. The main consumer spends attempt
# 1 and the worker spends the rest, so a lever set on only one of them either never fails
# or never keeps failing, and the attempt budget cannot be observed end to end.
x-failure-env: &failure-env
  RETRY_TOPIC: ${RETRY_TOPIC:-order-lifecycle.retry}
  DLQ_TOPIC: ${DLQ_TOPIC:-order-lifecycle.dlq}
  HANDLER_FAILURE_MODE: ${HANDLER_FAILURE_MODE:-none}
  HANDLER_FAILURE_ORDERS: ${HANDLER_FAILURE_ORDERS:-}
  HANDLER_FAILURE_ATTEMPTS: ${HANDLER_FAILURE_ATTEMPTS:-2}

# --- spec 003: the durable state store, written once for all five consumers ------
# STATE_BACKEND defaults to `memory` in config.py so a bare `python -m
# order_service.consumer.main` still reproduces 001's and 002's recorded results
# (003 D8). Compose turns it on explicitly — the assembled system runs the durable path.
#
# The DSN is built here rather than passed as five discrete settings so psycopg's own
# parser stays in charge and compose has one string to keep consistent. `${VAR:?...}`
# rather than `${VAR:-default}`: a default password is still a hardcoded credential
# (003 D13, R3.24). Copy .env.example to .env before the first `up`.
#
# From the host the same consumer uses @localhost:5432 instead of @postgres:5432 and
# changes nothing else — the shape R1.44 established for the broker (R3.26).
#
# The two levers (STATE_WRITE_ORDER, STATE_CRASH_AFTER) are deliberately NOT here.
# They are set per-experiment on ONE instance, the way 002 sets HANDLER_DELAY_SECONDS.
x-state-db-env: &state-db-env
  # Overridable so the whole group can be flipped back to 002's in-process state in one
  # variable, which is what makes the before/after comparison a single change:
  #   STATE_BACKEND=memory docker compose --profile scale-out up -d
  # Same shape as CONSUMER_GROUP_PROTOCOL above, and for the same reason.
  STATE_BACKEND: ${STATE_BACKEND:-postgres}
  STATE_DB_DSN: postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env (see .env.example)}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env (see .env.example)}

services:
  # --- spec 004: the three-broker cluster ---------------------------------
  # Node ids 1/2/3; hostnames kafka, kafka-2, kafka-3 (asymmetric on purpose, D2).
  # Everything shared lives in x-kafka-broker / x-kafka-env at the top of this file.
  #
  # Host ports 9092 / 9094 / 9095 all map to each container's own EXTERNAL 9092.
  # 9093 is the controller listener INSIDE each container and is never published.
  #
  # After changing the quorum, the old single-voter volumes cannot be reused:
  #   docker compose down -v && docker compose up -d && ./scripts/create_topics.sh
  kafka:
    <<: *kafka-broker
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"   # host clients (python, etc.)
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-2:
    <<: *kafka-broker
    container_name: kafka-2
    hostname: kafka-2
    ports:
      - "9094:9092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:19092,EXTERNAL://localhost:9094
    volumes:
      - kafka2-data:/var/lib/kafka/data

  kafka-3:
    <<: *kafka-broker
    container_name: kafka-3
    hostname: kafka-3
    ports:
      - "9095:9092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:19092,EXTERNAL://localhost:9095
    volumes:
      - kafka3-data:/var/lib/kafka/data

  # --- spec 003: the durable consumer state store -------------------------
  # Holds order_fold ONLY — the consumers' derived memory. The producer's
  # OrderStore stays in memory by design (003 D12): it is source-of-truth
  # state whose fix is a transactional outbox, not a table, and the topic is
  # already the source of truth for everything stored here.
  #
  # 5432 is published to the host for the same reason 9092 is: an experiment
  # can run in compose and be inspected with psql from outside it.
  #
  # NOTE: the initdb mount below runs ONLY when the volume is empty. After the
  # first `up`, schema changes need scripts/apply_state_schema.sh (003 D11).
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    ports:
      # Overridable because a developer machine very often already runs Postgres on
      # 5432, and a port clash should be one .env line rather than a reason to stop
      # publishing. The container side never moves, so STATE_DB_DSN is unaffected.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env (see .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env (see .env.example)}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/state_schema.sql:/docker-entrypoint-initdb.d/state_schema.sql:ro
    healthcheck:
      # -U/-d matter: the default `pg_isready` probes the `postgres` database as
      # the `postgres` role, which need not exist here, so it can report healthy
      # while the database the consumers use is still starting.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: playground
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: *kafka-bootstrap
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy

  # --- spec 001: prepaid order service + consumer fan-out -----------------
  # One image, four commands. They reach the broker on the INTERNAL listener
  # (kafka:19092), never localhost:9092 — that address only resolves from the
  # host.
  #
  # The three consumers subscribe to the SAME topic with THREE DIFFERENT group
  # ids — that is the fan-out: each one receives every event and keeps its own
  # offset. Spec 002 does the opposite below: notification runs as THREE members
  # of ONE group, so the same three partitions divide between them instead.
  # Both shapes run at once, which is what makes them comparable.
  #
  # All three come up with a plain `docker compose up` — the fan-out is only
  # visible when every group is reading, and T34/T39 need the other two running
  # to show that stopping one leaves them untouched.

  order-service:
    <<: *consumer-image
    container_name: order-service
    command: python -m order_service.producer.app
    ports:
      - "8010:8010"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: *kafka-bootstrap
      ORDER_LIFECYCLE_TOPIC: order-lifecycle
      ORDER_SERVICE_HOST: 0.0.0.0
      ORDER_SERVICE_PORT: 8010
    depends_on:
      kafka:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy

  inventory-consumer:
    <<: *consumer-image
    container_name: inventory-consumer
    command: python -m order_service.consumer.main
    environment:
      KAFKA_BOOTSTRAP_SERVERS: *kafka-bootstrap
      ORDER_LIFECYCLE_TOPIC: order-lifecycle
      SERVICE_NAME: inventory
      CONSUMER_GROUP_ID: inventory-service
      <<: [*state-db-env, *failure-env]
    depends_on: *consumer-deps

  # --- spec 002: notification scales out ----------------------------------
  # Three instances, ONE group id. The three partitions divide between them, so
  # each event is handled by exactly one — the inverse of the fan-out above,
  # running on the same topic at the same time. Inventory and analytics stay at
  # one instance each and are the control: they keep seeing every event.
  #
  # Only -1 starts by default. Bring the others in while watching the logs:
  #   docker compose --profile scale-out up -d
  #
  # STATIC_MEMBERSHIP=1 gives each instance a stable group.instance.id, so a
  # restart returns it to its own partitions instead of rebalancing the group.
  # Unset, `${VAR:+x}` yields "" and the consumer reads that as dynamic.

  notification-consumer-1:
    <<: *notification-consumer
    container_name: notification-consumer-1
    environment:
      <<: [*notification-env, *state-db-env, *failure-env]
      CONSUMER_INSTANCE_ID: notification-1
      CONSUMER_INSTANCE_ID_STATIC: ${STATIC_MEMBERSHIP:+notification-1}

  notification-consumer-2:
    <<: *notification-consumer
    container_name: notification-consumer-2
    profiles: ["scale-out"]
    environment:
      <<: [*notification-env, *state-db-env, *failure-env]
      CONSUMER_INSTANCE_ID: notification-2
      CONSUMER_INSTANCE_ID_STATIC: ${STATIC_MEMBERSHIP:+notification-2}

  notification-consumer-3:
    <<: *notification-consumer
    container_name: notification-consumer-3
    profiles: ["scale-out"]
    environment:
      <<: [*notification-env, *state-db-env, *failure-env]
      CONSUMER_INSTANCE_ID: notification-3
      CONSUMER_INSTANCE_ID_STATIC: ${STATIC_MEMBERSHIP:+notification-3}

  analytics-consumer:
    <<: *consumer-image
    container_name: analytics-consumer
    command: python -m order_service.consumer.main
    environment:
      KAFKA_BOOTSTRAP_SERVERS: *kafka-bootstrap
      ORDER_LIFECYCLE_TOPIC: order-lifecycle
      SERVICE_NAME: analytics
      CONSUMER_GROUP_ID: analytics-service
      <<: [*state-db-env, *failure-env]
    depends_on: *consumer-deps

  # --- spec 005: the process that does the waiting ------------------------
  # One container for all three services: every message on the retry topic names
  # its service in x-service, so routing is a lookup against SERVICE_REGISTRY —
  # the same table main.py builds the three consumers from (005 D1).
  #
  # It exists as a separate process for one reason: waiting out a backoff is the
  # thing the three consume loops must never do. Nothing this container does can
  # reach them.
  #
  # It sets no CONSUMER_GROUP_ID — that would collapse the three services' state
  # stores onto one group id and merge memories that must stay separate (D5).
  retry-worker:
    <<: *consumer-image
    container_name: retry-worker
    command: python -m order_service.consumer.retry_worker
    environment:
      KAFKA_BOOTSTRAP_SERVERS: *kafka-bootstrap
      ORDER_LIFECYCLE_TOPIC: order-lifecycle
      CONSUMER_INSTANCE_ID: retry-worker
      <<: [*state-db-env, *failure-env]
    depends_on: *consumer-deps

volumes:
  kafka-data:
  kafka2-data:
  kafka3-data:
  postgres-data:
